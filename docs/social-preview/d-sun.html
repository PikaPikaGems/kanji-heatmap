<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>D</title>
    <link rel="stylesheet" href="common.css" />
    <script src="common.js"></script>
    <style>
      body {
        background: #fbfaf7;
        color: #161616;
      }
      .sun {
        position: absolute;
        left: 44px;
        top: 50%;
        width: 560px;
        height: 560px;
        transform: translateY(-50%);
      }
      .sun .tile {
        position: absolute;
        width: 48px;
        height: 48px;
        border-radius: 11px;
        font-size: 27px;
      }
      .txt {
        position: absolute;
        left: 640px;
        top: 0;
        bottom: 0;
        right: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .k {
        font-family: "NSerif";
        font-weight: 900;
        font-size: 40px;
        color: #c8102e;
        letter-spacing: 10px;
      }
      h1 {
        font-family: "Nun";
        font-weight: 900;
        font-size: 98px;
        line-height: 0.98;
        letter-spacing: -3px;
        margin-top: 10px;
      }
      p {
        font-family: "NSJL";
        font-weight: 700;
        font-size: 29px;
        line-height: 1.35;
        color: #555;
        margin-top: 22px;
      }
      .pill {
        margin-top: 30px;
        align-self: flex-start;
        background: #c8102e;
        color: #fff;
        font-family: "NSJL";
        font-weight: 800;
        font-size: 24px;
        padding: 10px 24px;
        border-radius: 99px;
      }
    </style>
  </head>
  <body>
    <div class="sun" id="s"></div>
    <div class="txt">
      <div class="k">漢字暗記</div>
      <h1>Kanji<br />Heatmap</h1>
      <p>Learn 2,000+ Japanese Kanji fast—<br />the fun, smart way</p>
      <div class="pill">kanjiheatmap.com</div>
    </div>
    <script>
      const r = rng(5),
        pk = picker(r),
        pal = [
          "#fde2e4",
          "#fbb1b9",
          "#f4707f",
          "#e63950",
          "#c8102e",
          "#8f0a20",
        ],
        s = document.getElementById("s"),
        N = 11,
        P = 51,
        R = 5.6;
      for (let y = 0; y < N; y++)
        for (let x = 0; x < N; x++) {
          const dx = x - 5,
            dy = y - 5,
            d = Math.hypot(dx, dy);
          if (d > R) continue;
          const lv = Math.min(
            5,
            Math.max(0, Math.round(5 - d * 0.8 + (r() - 0.5) * 1.8))
          );
          const t = document.createElement("div");
          t.className = "tile";
          t.textContent = pk();
          t.style.left = x * P + 0 + "px";
          t.style.top = y * P + "px";
          t.style.background = pal[lv];
          t.style.color = lv < 3 ? "#7a1a28" : "#fff";
          s.appendChild(t);
        }
    </script>
  </body>
</html>
