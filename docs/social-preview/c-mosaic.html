<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>C</title>
    <link rel="stylesheet" href="common.css" />
    <script src="common.js"></script>
    <style>
      body {
        background: #0c0c0e;
      }
      .grid {
        position: absolute;
        left: -30px;
        top: -30px;
        display: grid;
        grid-template-columns: repeat(11, 112px);
        gap: 12px;
      }
      .tile {
        width: 112px;
        height: 112px;
        border-radius: 24px;
        font-size: 58px;
        color: #fff;
        border: 9px solid;
        font-family: "NSJ";
      }
      .card {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 760px;
        padding: 44px 40px 46px;
        border-radius: 36px;
        background: #0e0c14;
        text-align: center;
        color: #fff;
        box-shadow:
          0 0 0 6px rgba(255, 255, 255, 0.1),
          0 30px 80px rgba(0, 0, 0, 0.7);
      }
      .logo {
        display: grid;
        grid-template-columns: repeat(2, 74px);
        gap: 8px;
        justify-content: center;
        margin-bottom: 22px;
      }
      .logo .tile {
        width: 74px;
        height: 74px;
        font-size: 42px;
        border-radius: 16px;
        border-width: 6px;
      }
      h1 {
        font-family: "Nun";
        font-weight: 900;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -2px;
      }
      p {
        font-family: "NSJL";
        font-weight: 700;
        font-size: 30px;
        margin-top: 16px;
        color: #ffb8e6;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="g"></div>
    <div class="card">
      <div class="logo" id="l"></div>
      <h1>Kanji Heatmap</h1>
      <p>Learn 2,000+ Japanese Kanji fast—<br />the fun, smart way</p>
    </div>
    <script>
      const r = rng(23),
        pk = picker(r),
        fill = ["#5c0a47", "#8f0a6e", "#c40a8f", "#ff00aa", "#000"],
        bd = ["#ff6b6b", "#a3e635", "#f472b6", "#60a5fa", "#ffd60a"];
      function mk(ch, lv, b) {
        const t = document.createElement("div");
        t.className = "tile";
        t.textContent = ch;
        t.style.background = fill[lv];
        t.style.borderColor = bd[b];
        return t;
      }
      const g = document.getElementById("g");
      for (let i = 0; i < 66; i++)
        g.appendChild(mk(pk(), Math.floor(r() * 4), Math.floor(r() * 5)));
      [
        ["漢", 3, 0],
        ["字", 1, 1],
        ["暗", 0, 2],
        ["記", 2, 3],
      ].forEach((a) => document.getElementById("l").appendChild(mk(...a)));
    </script>
  </body>
</html>
